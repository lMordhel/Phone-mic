# phone-mic virtual microphone: the sink half.
#
# The phone bridge (phone-micd / scrcpy --audio-source=mic) plays the phone
# audio into `phonemic_sink`, a null sink. That sink's monitor is remapped into
# a real Audio/Source node, which is the node kind browsers, Discord and OBS
# enumerate as an input device.
#
# Only the sink is declared here. The remap source is created at runtime with
# `pactl load-module module-remap-source` (scripts/load-virtual-mic.sh), which
# packaging/install.sh runs for the current session and the bridge unit runs
# before every start.
#
# Do NOT move that module into `context.modules`. PipeWire 1.6 no longer ships
# libpipewire-module-remap-source, and a module listed there is mandatory: when
# it fails to load the daemon exits with "failed to create context" and the
# machine is left without any audio server, not merely without a microphone.
# `pactl load-module` keeps working because pipewire-pulse implements that module
# in-process instead of loading a shared object.
#
# Install:  cp conf/60-phone-mic.conf ~/.config/pipewire/pipewire.conf.d/
# Runtime (no restart):  use scripts/load-virtual-mic.sh

context.objects = [
    { factory = adapter
        args = {
            factory.name     = support.null-audio-sink
            node.name        = "phonemic_sink"
            node.description = "Phone Mic Sink"
            media.class      = "Audio/Sink"
            object.linger    = true
        }
    }
]
