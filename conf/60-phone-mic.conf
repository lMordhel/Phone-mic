# phone-mic virtual microphone.
#
# The phone bridge (scrcpy --audio-source=mic) plays the phone audio into
# `phonemic_sink` (a null sink).
# That sink's monitor is remapped into a real Audio/Source node, which is the
# node kind browsers, Discord and OBS enumerate as an input device.
#
# Install:  cp conf/60-phone-mic.conf ~/.config/pipewire/pipewire.conf.d/
# Runtime (no restart):  use scripts/load-virtual-mic.sh

context.objects = [
    { factory = adapter
        args = {
            factory.name     = support.null-audio-sink
            node.name        = "phonemic_sink"
            node.description = "Phone Mic Sink"
            media.class      = "Audio/Sink"
            object.linger    = true
        }
    }
]

context.modules = [
    { name = libpipewire-module-remap-source
        args = {
            master           = "phonemic_sink.monitor"
            node.name        = "phone_mic"
            node.description = "Phone-Mic"
            source.props = {
                media.class = "Audio/Source"
            }
        }
    }
]
